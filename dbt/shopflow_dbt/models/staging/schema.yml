version: 2

models:
  - name: stg_customers
    description: Cleaned and standardized customer data from Olist dataset
    columns:
      - name: customer_id
        description: Unique customer identifier
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: Unique customer identifier across all orders
      - name: zip_code
        description: Customer zip code (first 5 digits)
      - name: city
        description: Customer city
      - name: state
        description: Customer state (2-letter code)

  - name: stg_orders
    description: Cleaned and standardized order data from Olist dataset
    columns:
      - name: order_id
        description: Unique order identifier
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        description: Current order status
      - name: order_date
        description: Date order was placed
        tests:
          - not_null
      - name: is_delivered
        description: Flag indicating if order was delivered
      - name: delivered_on_time
        description: Flag indicating if order was delivered on time

  - name: stg_order_items
    description: "Cleaned and standardized order items (grain: one row per item)"
    columns:
      - name: order_id
        description: Order identifier
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: order_item_id
        description: Sequential item number within order
        tests:
          - not_null
      - name: product_id
        description: Product identifier
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: seller_id
        description: Seller identifier
        tests:
          - not_null
      - name: price
        description: Item price in BRL
        tests:
          - not_null
      - name: freight_value
        description: Item freight cost in BRL
        tests:
          - not_null

  - name: stg_products
    description: Cleaned product data with English category names
    columns:
      - name: product_id
        description: Unique product identifier
        tests:
          - unique
          - not_null
      - name: category_name
        description: Product category in English
      - name: product_weight_g
        description: Product weight in grams
      - name: product_volume_cm3
        description: Product volume in cubic centimeters

  - name: stg_payments
    description: Cleaned payment data from Olist dataset
    columns:
      - name: order_id
        description: Order identifier
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: payment_sequential
        description: Sequential payment number for order
        tests:
          - not_null
      - name: payment_type_standardized
        description: Standardized payment method
        tests:
          - accepted_values:
              values: ['Credit Card', 'Boleto', 'Voucher', 'Debit Card', 'Other']
      - name: payment_value
        description: Payment amount in BRL
        tests:
          - not_null

  - name: stg_sellers
    description: Cleaned seller data from Olist dataset
    columns:
      - name: seller_id
        description: Unique seller identifier
        tests:
          - unique
          - not_null
      - name: city
        description: Seller city
      - name: state
        description: Seller state

  - name: stg_geolocation
    description: Aggregated geolocation data mapping zip codes to coordinates
    columns:
      - name: zip_code
        description: Zip code prefix (5 digits)
        tests:
          - unique
          - not_null
      - name: latitude
        description: Average latitude for zip code
      - name: longitude
        description: Average longitude for zip code

  - name: stg_order_reviews
    description: Cleaned customer review data
    columns:
      - name: review_id
        description: Unique review identifier
        tests:
          - unique
          - not_null
      - name: order_id
        description: Order being reviewed
        tests:
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: review_score
        description: Review score (1-5)
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]
      - name: review_sentiment
        description: Review sentiment category
        tests:
          - accepted_values:
              values: ['Positive', 'Neutral', 'Negative']
